[project]
name = "finalproject-litvyakov-m26-555"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[tool.valutatrade]
users_path = "data/users.json"
portfolios_path = "data/portfolios.json"
rates_path = "data/rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_path = "logs/actions.log"
log_level = "INFO"
log_format = "text"